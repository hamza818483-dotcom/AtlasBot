name: Watchdog - Render Primary Health Monitor

# Primary (atlasbot-pvp7) health check only.
# Webhook is ALWAYS kept on Primary — no auto-switching to backup.
# Required repo secrets: BOT_TOKEN, RENDER_URL, OWNER_ID

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Check Primary Render health
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          RENDER_URL: ${{ secrets.RENDER_URL }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
        run: |
          set -e
          if [ -z "$BOT_TOKEN" ] || [ -z "$RENDER_URL" ]; then
            echo "::warning::BOT_TOKEN or RENDER_URL secret not set — skipping"
            exit 0
          fi

          PRIMARY="${RENDER_URL%/}"
          PRIMARY_TARGET="${PRIMARY}/webhook/${BOT_TOKEN}"

          echo "Checking Primary Render health ($PRIMARY)..."
          PRIMARY_OK="false"
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 "${PRIMARY}/health" || echo "000")
            echo "  attempt $i: /health -> $STATUS"
            if [ "$STATUS" = "200" ]; then
              PRIMARY_OK="true"
              break
            fi
            sleep 10
          done

          # Always ensure webhook is on Primary
          CURRENT_WH=$(curl -s --max-time 15 \
            "https://api.telegram.org/bot${BOT_TOKEN}/getWebhookInfo" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('result',{}).get('url',''))" 2>/dev/null || echo "")
          echo "Current webhook: $CURRENT_WH"

          if [ "$CURRENT_WH" != "$PRIMARY_TARGET" ]; then
            echo "Webhook not on Primary — fixing..."
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/setWebhook" \
              -H "Content-Type: application/json" \
              -d "{\"url\":\"${PRIMARY_TARGET}\",\"drop_pending_updates\":false,\"max_connections\":40}"
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d "chat_id=${OWNER_ID}" \
              -d "text=🔧 Webhook corrected to Primary Render (${PRIMARY})" || true
          else
            echo "Webhook already on Primary — OK"
          fi

          if [ "$PRIMARY_OK" = "false" ]; then
            echo "::warning::Primary Render is DOWN!"
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d "chat_id=${OWNER_ID}" \
              -d "text=🚨 Primary Render (${PRIMARY}) is DOWN! Webhook stays pointed at Primary — bot may be offline." || true
          else
            echo "Primary is healthy."
          fi
